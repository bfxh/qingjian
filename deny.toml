# cargo-deny：依赖供应链门禁（license / bans / sources）。
#
# 漏洞公告（advisories）由 audit.yml 里的 cargo audit 负责，这里不重复跑，
# 所以 CI 执行的是 `cargo deny check bans licenses sources`（也免掉拉 advisory DB 的网络依赖）。

[graph]
# 覆盖真实构建用到的全部目标；漏了会导致对应平台依赖被跳过、门禁形同虚设。
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]

[licenses]
version = 2
# 项目自身是 GPL-3.0-or-later，故 allowlist 取「宽松许可 + GPL-3.0 系 + LGPL」，
# 保持向下兼容：宽松许可的代码可以并入 GPL-3.0 工程，反之不行。
#
# 注意 self_cell 的 license 字段是 `Apache-2.0 OR GPL-2.0-only`：
# 选 Apache-2.0 即与 GPL-3.0 兼容（GPL-2.0-only 单独出现才不兼容）。
# cargo-deny 遇到 OR 表达式时，只要有一项在 allowlist 内即判定通过。
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LicenseRef-Qingjian-Commercial",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# 同一 crate 多版本（如 base64 0.13/0.22/0.23）在传递依赖里普遍存在且大多无害，
# 先设为 warn：看得见、不阻断。真正的风险（外部依赖通配符版本、重复构建脚本）另行拦。
multiple-versions = "warn"
# 禁掉通配符版本：外部依赖写 `*` 不受语义化约束，可被静默换掉。
# 但工作区内部 crate 是 `path` 依赖，版本要求为空等价于 `*`，且同仓由 Cargo.lock 锁定，
# 故放行 path 依赖上的通配符——否则会把 15 个内部 crate 全误报为漏洞。
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# 只允许 crates.io + 明确列出的团队 fork；出现未知 registry / git 依赖说明有人塞了旁路来源。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# cosmic-text 用的是团队 fork 且钉死了 rev（不可变引用），显式放行。
# 注意：这里只允许“整仓”，不按 rev 过滤——换了 fork 地址就应当重新评审。
allow-git = ["https://github.com/qingjian-team/cosmic-text"]
