# cargo-deny 门禁配置：依赖树的许可证与 RustSec 已知漏洞在 PR 与 main 上都要过这道门
# （.github/workflows/quality.yml 的 deps job；audit.yml 的 rustsec 照旧每周跑一遍兜底）。
# 本地跑：cargo deny check（先 cargo install cargo-deny）。
#
# 白名单来自 2026-09-20 `cargo deny list` 对整棵依赖树的实测：
#   - 本仓 qingjian-* crate：GPL-3.0-or-later（根 Cargo.toml 的 license）
#   - self_cell：Apache-2.0 OR GPL-2.0-only 双许可，走 Apache-2.0 那条，兼容
#   - r-efi（UEFI 引导段）：LGPL-2.1-or-later，与 GPL-3.0 兼容
# 新依赖的许可证不在表里时，先核与 GPL-3.0 的兼容性再决定加不加，不要随手往 allow 里塞。

[advisories]
# RustSec 里的漏洞 / unsound / 被撤下版本一律红；unmaintained 撞上就红，除非在 ignore 里记了 reason。
# 新依赖触发 unmaintained 时先看有没有升级路径：能升就升，升不了才往 ignore 里记 reason。
yanked = "deny"
unmaintained = "all"
ignore = [
    # 传递依赖里两个「无人维护」且没有可升级路径的包：门保持全绿，但记录在案；
    # 哪天任一条被换掉/修复，unused-ignored-advisory 会警告清掉对应 ignore。
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 无人维护（cosmic-text fork -> fontdb 传递引入，无安全升级）；根治是渲染器迁到 skrifa（fontations）" },
    { id = "RUSTSEC-2024-0436", reason = "paste 不再维护（传递引入的 proc-macro 工具，功能已冻结、无替代品）" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# 重复版本一律红，除非在 skip 里登记了理由（2026-09-20 实测清单，新增重复必须进登记）
multiple-versions = "deny"
skip = [
    # windows-rs 一家：0.62（Server/TSF 主线）与 0.100（windows-core 等新代）并存是依赖现实，全家一起升（dependabot 合成）
    { name = "windows-collections", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-collections", version = "0.3.2", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-core", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-core", version = "0.62.2", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-future", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-future", version = "0.3.2", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-link", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-link", version = "0.2.1", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-numerics", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-numerics", version = "0.3.1", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-result", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-result", version = "0.4.1", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-strings", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-strings", version = "0.5.1", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-threading", version = "0.100.0", reason = "windows-rs 下一代与 0.62 主线并存" },
    { name = "windows-threading", version = "0.2.1", reason = "windows-rs 下一代与 0.62 主线并存" },
    # 其余转正 / 双包的版本对（2026-09-20 实测）：图谱里 genuinely 并存，升级时逐个收敛
    { name = "base64", reason = "0.13/0.22/0.23 三代并存（protocol 新旧 + 工具链）" },
    { name = "font-types", reason = "cosmic-text 字族两代并存" },
    { name = "getrandom", reason = "0.3/0.4 两代并存" },
    { name = "hashbrown", reason = "0.16/0.17 两代并存" },
    { name = "miniz_oxide", reason = "0.8/0.9 两代并存" },
    { name = "r-efi", reason = "UEFI 引导段 5.x/6.x 两代并存" },
    { name = "read-fonts", reason = "cosmic-text 字族两代并存" },
    { name = "skrifa", reason = "cosmic-text 字族两代并存" },
    { name = "syn", reason = "2.x/3.x 两代并存（宏生态）" },
    { name = "thiserror", reason = "1.x/2.x 两代并存" },
    { name = "thiserror-impl", reason = "1.x/2.x 两代并存" },
]
