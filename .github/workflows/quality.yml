# PR 与 main 上的质量门：PR 标题规范（与 .githooks/commit-msg 同一套 Conventional Commits）、
# 依赖许可证与已知漏洞（cargo-deny，deny.toml 在根目录）、秘密扫描（gitleaks，全历史）、仓库卫生。
# 与 ci.yml（编译 / 测试 / 文档）和 audit.yml（周度 rustsec + 覆盖率）互补；actions 一律钉 commit，Dependabot 每周更新。
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 与 .githooks/commit-msg 同一套类型与范围（docs/contributing.md「提交信息」）
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            style
            revert
          scopes: |
            core
            platform
            render
            dictionary
            translate
            learning
            predict
            lm
            neural
            format
            cli
            macos
            windows
            server
            tsf
            settings
            installer
            linux
            tools
            docs
            ci
            deps
            release
          # 范围可省略（跨好几处时）；说明部分不能为空
          requireScope: false
          subjectPattern: ^\S.*$
          subjectPatternError: 'PR 标题说明部分不能为空，例如 fix(core): 修自绘输入框吞数字'

  deps:
    name: Dependency licenses / advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action 2026 起对组织仓库要求商业 license（GITLEAKS_LICENSE），install-action 也不带 gitleaks；
      # 直接下载官方 release 二进制（钉死版本，asset 名带平台后缀）
      - name: Install gitleaks CLI
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # 有 .gitleaks.toml 时 gitleaks **不会**自动加载默认规则集——`extend.useDefault = true`
      # 这一行就是「全量规则」与「零规则」之差：删掉它，扫描永远报 no leaks、退出 0，而且
      # 通过日志里看不出规则集为空（版本号、扫描字节数、提交数全都照常打印）。
      # 故把这一行变成显式断言——它没了，这一步先红（独立审核 2026-09-21 指出）。
      - name: Assert gitleaks still loads the default rules
        run: |
          python3 -c "import tomllib;c=tomllib.load(open('.gitleaks.toml','rb'));assert c.get('extend',{}).get('useDefault') is True, 'extend.useDefault 丢了——默认规则集不再加载，门静默变弱'"

      # 命中时把「规则 / 文件:行 / 提交」打到日志（--redact 已把 Secret 字段脱敏）——
      # 否则门只会吐一句 leaks found: N，定位只能靠猜（这次豁免夹具时踩过）。
      # --config 显式给路径：不依赖「恰好在仓库根运行」这个隐含前提。
      - name: Scan full history
        run: |
          gitleaks git --config .gitleaks.toml --exit-code=1 --log-opts="--all" --redact \
            --report-format json --report-path gitleaks.json || {
            echo "::error::gitleaks 非零退出：可能是命中（下表为位置，Secret 已脱敏），也可能是工具/配置报错——看上面输出分辨"
            python3 -c "import json;print(chr(10).join('  %s  %s:%s  commit=%s' % (f.get('RuleID') or f.get('Description'), f.get('File'), f.get('StartLine'), str(f.get('Commit'))[:8]) for f in json.load(open('gitleaks.json'))))" \
              || echo "  （报告没读出来——多半是工具/配置错误而非命中，看上面输出）"
            exit 1
          }

  todos:
    name: TODO / FIXME sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for left-behind markers
        run: python3 scripts/detect_todos.py

  unsafety:
    name: Unsafe increment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check unsafe against baseline
        run: python3 scripts/unsafe_audit.py

  pr-size:
    name: PR size check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment if the PR is large
        env:
          GH_TOKEN: ${{ github.token }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          total=$(( ADDITIONS + DELETIONS ))
          if (( total > 1200 )); then
            gh pr comment "$NUMBER" --repo "${{ github.repository }}" --body \
              "这个 PR 有 **${total} 行**改动，明显偏大。审起来费劲也容易漏：如果拆得开，建议先拆成几个独立 PR（功能块 / 平台壳 / 数据分开放）再合，参考 #51 的拆分方式。"
          fi

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for junk files
        run: |
          junk="$(git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|\._|~\$|.*\.tmp)$' || true)"
          if [[ -n "$junk" ]]; then
            echo "$junk" >&2
            echo "仓库里不该有隐藏 / 系统元数据 / 临时文件（词典打包混进这种文件会出 #166 那种事）" >&2
            exit 1
          fi
