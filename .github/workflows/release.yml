# 推 v<版本> 标签发三个平台（共用一个 GitHub Release）；单平台补丁推 macos-v / windows-v / linux-v<版本>，只打那一个平台。
# 版本号读各平台壳：macOS apps/macos/Cargo.toml、Windows apps/windows/server/Cargo.toml、Linux apps/linux/server/Cargo.toml，要打的平台都得与标签一致。
# 流程：prepare 核对版本、建草稿 Release → 各平台 job 并行打包，把安装包与摘要 / 构建信息片段传到草稿上
# → publish 合并片段、转正、生成并签名 releases.json、触发官网构建。任何平台失败都停在草稿，不会发出缺平台的版本。
# 流程见 docs/notes/release.md。macOS 的签名与公证可选，下面的 Secrets 配齐才签，否则出 ad-hoc 包；
# Windows 现在没有代码签名（QINGJIAN_UIACCESS=0 关掉 uiAccess，否则没签名的 Server 起不来），证书办下来再加 signtool。
#   QINGJIAN_CERT_P12            Developer ID Application + Installer 两张证书（含私钥）导出的 .p12，base64
#   QINGJIAN_CERT_PASSWORD       .p12 的密码
#   QINGJIAN_SIGN_IDENTITY       "Developer ID Application: 名字 (TEAMID)"
#   QINGJIAN_INSTALLER_IDENTITY  "Developer ID Installer: 名字 (TEAMID)"
#   QINGJIAN_NOTARY_KEY          App Store Connect API 密钥 .p8，base64
#   QINGJIAN_NOTARY_KEY_ID       密钥的 Key ID
#   QINGJIAN_NOTARY_ISSUER       密钥的 Issuer ID
# 版本索引的签名（必须，没配门禁直接失败）：
#   QINGJIAN_INDEX_SIGNING_KEY   releases.json 的 ed25519 私钥（base64 的 32 字节，tools/release-sign keygen 生成），
#                                公钥在 crates/qingjian-update/src/index/signature.rs；软件内检查更新只认签过名的索引
# 发版后让官网重新构建（也可选）：
#   QINGJIAN_WEB_TOKEN           fine-grained PAT，对 qingjian-team/qingjian-web 有 Contents: read and write
#                                （官网由 Cloudflare 按仓库提交自动构建，tools/release/bump-website.sh 往那边推一个小提交）
#
# 门禁：版本号与标签一致且不带 -dev；标签指向的提交必须在 main 上（防止从没合并的分支或手滑的本地提交发版）。
# Secrets 不放 workflow 顶层 env，只注入真正用它的那一步；有没有配由第一步算成输出（secrets 不能直接写在 if 里）。
# actions 钉到 commit（注释是对应标签），Dependabot 每周更新；产品数据与本地整句模型按 tools/release/data.lock 钉住的 data-vN Release 下载、按锁文件里的哈希校验，标签与哈希记进 build-info.json。
name: release

on:
  push:
    tags: ['v*', 'macos-v*', 'windows-v*', 'linux-v*']

env:
  CARGO_TERM_COLOR: always

# 同一个标签重复推送（改错标签再推一次、或手滑 re-tag）时排队，不并发。
# **不能 cancel-in-progress**：CI 里取消旧运行没损失，发版流程取消会留下半成品——
# draft release 已建、部分平台的包已上传、checksums 合了一半、releases.json 可能签了一半。
# 那种状态下重跑，finish-release.sh 面对的是「草稿里已有本次运行的资产」，容易重复上传或漏合。
# 让它跑完（哪怕是失败）比重跑安全：失败会停在草稿，人工看一眼就能决定重推还是收尾。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.gate.outputs.version }}
      macos: ${{ steps.gate.outputs.macos }}
      windows: ${{ steps.gate.outputs.windows }}
      linux: ${{ steps.gate.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions match tag and tag is on main
        id: gate
        env:
          INDEX_KEY_SET: ${{ secrets.QINGJIAN_INDEX_SIGNING_KEY != '' }}
        run: |
          if [[ "$INDEX_KEY_SET" != "true" ]]; then
            echo "没配 QINGJIAN_INDEX_SIGNING_KEY：releases.json 签不了名，已装的青简都不认这份索引、收不到更新提示（docs/notes/release.md）" >&2
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*) PLATFORMS="macos windows linux"; VERSION="${GITHUB_REF_NAME#v}" ;;
            *-v*) PLATFORMS="${GITHUB_REF_NAME%%-v*}"; VERSION="${GITHUB_REF_NAME#*-v}" ;;
          esac
          declare -A MANIFEST=([macos]=apps/macos/Cargo.toml [windows]=apps/windows/server/Cargo.toml [linux]=apps/linux/server/Cargo.toml)
          for platform in $PLATFORMS; do
            found="$(sed -n 's/^version = "\(.*\)"/\1/p' "${MANIFEST[$platform]}" | head -1)"
            if [[ "$found" != "$VERSION" ]]; then
              echo "${MANIFEST[$platform]} 是 $found，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
              exit 1
            fi
          done
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          for platform in macos windows linux; do
            [[ " $PLATFORMS " == *" $platform "* ]] && on=true || on=false
            echo "$platform=$on" >> "$GITHUB_OUTPUT"
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
          MACOS: ${{ steps.gate.outputs.macos }}
          WINDOWS: ${{ steps.gate.outputs.windows }}
          LINUX: ${{ steps.gate.outputs.linux }}
          MAC_SIGNED: ${{ secrets.QINGJIAN_CERT_P12 != '' }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          python3 tools/release/releases_json.py --notes-for "$VERSION" > "$NOTES"
          if [[ "$MACOS" == "true" && "$MAC_SIGNED" != "true" ]]; then
            printf '\n> macOS：这一版没有 Apple 开发者签名，首次打开系统会拦一下：到「系统设置 → 隐私与安全性」底部点「仍要打开」再装一次。\n' >> "$NOTES"
          fi
          if [[ "$WINDOWS" == "true" ]]; then
            printf '\n> Windows：这一版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。\n' >> "$NOTES"
          fi
          if [[ "$LINUX" == "true" ]]; then
            printf '\n> Linux：预编译包在 Ubuntu 26.04 上构建，其他发行版请用源码安装；解开后运行 install.sh，说明见官网文档「Linux」。\n' >> "$NOTES"
          fi
          case "$GITHUB_REF_NAME" in
            macos-v*) TITLE="青简 macOS $VERSION" ;;
            windows-v*) TITLE="青简 Windows $VERSION" ;;
            linux-v*) TITLE="青简 Linux $VERSION" ;;
            *) TITLE="青简 $VERSION" ;;
          esac
          # 带预发布后缀的版本（0.1.4-beta.1）是测试渠道的：标成预发布，不抢 GitHub 的 latest
          PRERELEASE=(); [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease --latest=false)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$TITLE" --notes-file "$NOTES" ${PRERELEASE[@]+"${PRERELEASE[@]}"}

      # 门禁（版本号 / 标签在 main 上）失败时把 notes.md 留下：那是 releases_json.py
      # 从 CHANGELOG 解析出来的版本说明，解析失败（标题格式不对、版本不在 CHANGELOG 里）
      # 时它是空文件或半截——能直接看出是解析问题还是版本号问题。
      # 不设 target/**/*.log：这一步没有 cargo 参与，那些路径本来就是空的。
      - name: Upload prepare diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75d540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-prepare-diagnostics
          path: |
            ${{ runner.temp }}/notes.md
          if-no-files-found: ignore
          retention-days: 7

  macos:
    needs: prepare
    if: needs.prepare.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bundle.sh 用提交数当构建号
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: |
          echo "sign=${{ secrets.QINGJIAN_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"
          echo "notarize=${{ secrets.QINGJIAN_NOTARY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      - name: Import signing certificates
        if: steps.secrets.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.QINGJIAN_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.QINGJIAN_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.QINGJIAN_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.QINGJIAN_INSTALLER_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          {
            echo "QINGJIAN_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "QINGJIAN_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY: ${{ secrets.QINGJIAN_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.QINGJIAN_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.QINGJIAN_NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials qingjian --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "QINGJIAN_NOTARY_PROFILE=qingjian" >> "$GITHUB_ENV"

      - name: Build pkg (arm64)
        # shell: bash 带 pipefail：`| tee` 不会把 bundle.sh 的失败吞成 tee 的 0
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ci-logs"
          QINGJIAN_TARGET=aarch64-apple-darwin apps/macos/scripts/bundle.sh --pkg 2>&1 \
            | tee "$GITHUB_WORKSPACE/target/ci-logs/bundle-arm64.log"

      - name: Build pkg (x86_64)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ci-logs"
          QINGJIAN_TARGET=x86_64-apple-darwin apps/macos/scripts/bundle.sh --pkg 2>&1 \
            | tee "$GITHUB_WORKSPACE/target/ci-logs/bundle-x86_64.log"

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload-build.sh macos "macOS $(sw_vers -productVersion)" target/pkg/*.pkg

      # 失败时把 bundle.sh 的输出打包上传：macOS 打包这一步最麻烦（两个 target、
      # 签名、component.plist、pkgbuild），失败信息全在 bundle.sh 自己的输出里。
      # 只收文本日志，不收 .pkg 本体（几百 MB）。
      - name: Upload macOS diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75d540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-diagnostics
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # 没有代码签名证书：Server 不带 uiAccess（没签名的 exe 带 uiAccess=true 起不来；build.rs 缺省也不带，build.ps1 还会按 -Sign 重设）。证书办下来后在 build.ps1 加 signtool、走 -Sign。
      QINGJIAN_UIACCESS: '0'
      PYTHON: python
      # Windows 上 Python 的标准输出缺省 cp1252，中文更新日志会编码失败。
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          # 安装包另带一份 32 位 TSF DLL（build.ps1 编）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      # 与开发机同版本（7.1.0，自带简体中文翻译；Chocolatey 只有 6.x，6 的安装包不带简中）。钉死 GitHub Release 上的文件。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（2026-09-11 从上面地址下载后算出），对不上就不装。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        # pwsh 下用 Tee-Object 落盘：安装器失败（Inno Setup 脚本、签名、资源编译）时
        # 这是唯一能回看 build.ps1 自己输出的地方。
        # 目录用 $env:GITHUB_WORKSPACE 拼绝对路径：build.ps1 自己按脚本位置算仓库根
        # （$PSScriptRoot 上跳三层），对当前目录不敏感；这里显式锚到 workspace，
        # 免得将来有步骤改了工作目录，日志落到别处、诊断上传收空。
        shell: pwsh
        run: |
          $logs = Join-Path $env:GITHUB_WORKSPACE 'target\ci-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1 2>&1 |
            Tee-Object -FilePath (Join-Path $logs 'installer.log')

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload-build.sh windows "$(powershell -NoProfile -Command '(Get-CimInstance Win32_OperatingSystem).Caption' | tr -d '\r')" target/installer/*.exe

      - name: Upload Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75d540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-diagnostics
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  linux:
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    # Fcitx5 插件链接的是构建机上的 Fcitx5，与已验证的 Ubuntu 26.04 一致
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Fcitx5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libssl-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev nlohmann-json3-dev fcitx5

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      - name: Build package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ci-logs"
          apps/linux/scripts/package.sh 2>&1 | tee "$GITHUB_WORKSPACE/target/ci-logs/package.log"

      # 装进临时目录再卸载：包里文件齐、校验过得去、两个二进制在这台机器上找得到全部动态库。
      # shell: bash 带 pipefail，`| tee` 不会把失败吞成 tee 的 0——诊断上传靠它触发。
      # 整段套进 { ...; } 2>&1 | tee：管道退出码取花括号组的，任一句失败都算整段失败
      # （花括号组是当前 shell 里的复合命令，退出码是组内最后一条失败命令的）。
      - name: Smoke-test package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ci-logs"
          {
            work="$RUNNER_TEMP/package-test"
            mkdir -p "$work"
            tar -xzf target/linux-package/*.tar.gz -C "$work"
            cd "$work"/qingjian-*/
            export XDG_DATA_HOME="$work/data"
            ./install.sh --prefix "$work/prefix"
            for binary in "$work/prefix/bin/qingjian-linux-server" "$work/prefix/lib/fcitx5/qingjian.so"; do
              if ldd "$binary" | grep 'not found'; then exit 1; fi
            done
            ./uninstall.sh --prefix "$work/prefix"
            test ! -e "$work/prefix/bin/qingjian-linux-server"
          } 2>&1 | tee "$GITHUB_WORKSPACE/target/ci-logs/smoke-test.log"

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload-build.sh linux "$(. /etc/os-release && echo "$PRETTY_NAME"), Fcitx5 $(pkg-config --modversion Fcitx5Core)" target/linux-package/*.tar.gz

      # 与 ci.yml 的 core job 同一个思路：打包 / 冒烟测试失败时日志是唯一线索。
      - name: Upload Linux diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75d540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-diagnostics
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [prepare, macos, windows, linux]
    # 没选中的平台是 skipped，照样发；有平台失败就停在草稿
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: echo "website=${{ secrets.QINGJIAN_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Merge checksums and build info, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: tools/release/finish-release.sh "$GITHUB_REF_NAME" "$VERSION" "$RUNNER_TEMP/release"

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
          QINGJIAN_INDEX_SIGNING_KEY: ${{ secrets.QINGJIAN_INDEX_SIGNING_KEY }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh

      # publish 是最后一道：合 checksums、签 releases.json、触发官网构建。
      # 这里失败最危险——草稿已是完整的一版，但索引没签 / 官网没更新，
      # 用户侧表现为「Release 页有新版、客户端却不提示」。
      # $RUNNER_TEMP/release 里是 finish-release.sh 真实下载又合成的
      # SHA256SUMS / build-info.json 与各平台片段，失败时能直接看出合到哪一步、
      # 哪个平台的片段缺失。
      - name: Upload publish diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75d540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publish-diagnostics
          path: ${{ runner.temp }}/release/
          if-no-files-found: ignore
          retention-days: 7
