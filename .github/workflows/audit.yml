# 依赖已知漏洞（RustSec）：每周一跑一次，Cargo.lock 变了也跑。
name: audit

on:
  schedule:
    - cron: '0 2 * * 1'
  push:
    paths: ['Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.lock']

# audit-check 要往提交上写 check run（checks: write）、发现漏洞时开 issue（issues: write）；少了 checks 会在 push 事件上报 "Resource not accessible by integration"
permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    # ubuntu-26.04 与 ci.yml / release.yml 一致：仓库里其它 job 都钉这个，
    # 只有这里是 ubuntu-latest。那个标签会随 GitHub 的策略漂移（现在指向的版本
    # 与 26.04 不同），同一个仓库三套 Ubuntu 版本，出问题时会多一个变量。
    runs-on: ubuntu-26.04
    # 只是 cargo audit 一次，给 15 分钟够宽松；没有超时的定时任务卡住不会有人发现
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
