# 六个 job：Linux 跑 fmt / clippy / 全 workspace 测试（排除 IMK 外壳）；macOS 与 Windows runner 各编各的壳并跑平台测试；
# iOS / Android / OHOS（华为 HarmonyOS）对移动端目标做跨目标 cargo check（不链接，排除桌面壳与目标不可用依赖，见各作业注释）。
# 平台特有的编译错（Objective-C 调用、TSF 导出、WinUI、移动端目标破坏）在 PR 里就暴露，不等发版。仓库公开，Actions 不计费。
# actions 一律钉到 commit（注释里是对应的标签），Dependabot 每周提 PR 更新；cargo 全加 --locked，Cargo.lock 没提交就报错。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Fcitx5 build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev nlohmann-json3-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude qingjian-macos --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude qingjian-macos --locked

      - name: Build and test Fcitx5 default panel
        run: |
          cargo build -p qingjian-linux-server --locked
          cmake -S apps/linux/fcitx5 -B target/fcitx5-stage1 -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build target/fcitx5-stage1 --parallel 2
          env -u DBUS_SESSION_BUS_ADDRESS ctest --test-dir target/fcitx5-stage1 --output-on-failure
          bash -n apps/linux/scripts/install.sh apps/linux/scripts/uninstall.sh apps/linux/scripts/package.sh apps/linux/scripts/package-install.sh
          python3 apps/linux/tests/installation.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (IMK shell)
        run: cargo clippy -p qingjian-macos --all-targets --locked -- -D warnings

      - name: Test (IMK shell)
        run: cargo test -p qingjian-macos --locked

  windows:
    runs-on: windows-latest
    env:
      # Server 的 build.rs 嵌 uiAccess manifest，没签名的 exe（含测试二进制）起不来（os error 740）；与 release.yml 一样关掉
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: clippy
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (Server, TSF DLL, Settings)
        run: cargo clippy -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --all-targets --locked -- -D warnings

      - name: Test (Server, TSF DLL, Settings)
        run: cargo test -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --locked

      # 安装包另带一份 32 位 DLL（企业微信 / WPS 这类 32 位应用只能加载它）
      - name: Check (TSF DLL, 32-bit)
        run: cargo check -p qingjian-windows-tsf --target i686-pc-windows-msvc --locked

  # ---- 移动端目标编译检查（iOS / Android）----
  # Core 声明平台无关，但依赖树混进目标不可用的东西时，只有跨目标 check 能在 PR 里暴露。
  # cargo check 不链接：无需 NDK / iOS SDK，也无需模拟器，跑不了测试但能把目标级编译破坏挡在合入前。
  # 桌面壳（IMK / TSF / Fcitx5 Server / 设置程序）绑定桌面框架，两个作业都排除。
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # apple 目标上 native-tls 走 Security.framework，无 openssl；render 排除——fonts/ 的
      # 字体发现模块只有 windows/linux/macos 三个实现（platform 别名未接 iOS），
      # 是 render spike 的已知缺口，稳定后补。
      - name: Check (aarch64-apple-ios)
        run: cargo check --workspace --exclude qingjian-macos --exclude qingjian-linux-server --exclude qingjian-windows-server --exclude qingjian-windows-tsf --exclude qingjian-windows-settings --exclude qingjian-render --target aarch64-apple-ios --locked

  android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # core 的简繁转换（ferrous-opencc -> onig_sys）要交叉编译 C；runner 已预装 NDK
      # （ANDROID_NDK_HOME 指向 ndk/27.x），但 cc-rs 的探测没吃进去（报
      # "failed to find tool aarch64-linux-android-clang"，这是无 NDK 时的裸工具名兜底），
      # 显式给 CC/CXX/AR 绕开探测。
      - name: 指到预装 NDK 的交叉 clang（onig_sys 编 C 用）
        run: |
          echo "CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      # android 上 native-tls 落到 openssl-sys，而 platform -> predict -> async-openai -> reqwest(native-tls)
      # 是硬依赖边，openssl-sys 的 build script 需要 NDK + 交叉 openssl，先把传染闭包
      # （platform / predict / update / cli / tools）排除，全量覆盖等 native-tls 换 rustls
      # 或按目标门控后再放开（见 issue #235）。render 同样排除（同 iOS 作业注释）。
      - name: Check (aarch64-linux-android)
        run: cargo check --workspace --exclude qingjian-macos --exclude qingjian-linux-server --exclude qingjian-windows-server --exclude qingjian-windows-tsf --exclude qingjian-windows-settings --exclude qingjian-platform --exclude qingjian-predict --exclude qingjian-update --exclude qingjian-cli --exclude qingjian-gloss-gen --exclude qingjian-release-sign --exclude qingjian-render --target aarch64-linux-android --locked

  # ---- 华为手机（HarmonyOS / OpenHarmony）目标编译检查 ----
  ohos:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-unknown-linux-ohos

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # onig_sys（ferrous-opencc 的 C 依赖）要交叉编译；runner 不预装 OHOS SDK，从华为云
      # 官方仓库拉，版本钉死 5.1.0-Release（URL 失效会先红在这，不会静默漂移）。
      # tar 里是各子系统 zip，只解 native 的 linux-x64 包（llvm 工具链 + sysroot）。
      - name: 下载并展开 OpenHarmony SDK 的 native 工具链
        run: |
          curl -fsSL --retry 2 -o /tmp/ohos-sdk.tar.gz \
            "https://repo.huaweicloud.com/openharmony/os/5.1.0-Release/ohos-sdk-windows_linux-public.tar.gz"
          mkdir -p /tmp/ohos-sdk /tmp/ohos-native
          tar -xzf /tmp/ohos-sdk.tar.gz -C /tmp/ohos-sdk
          find /tmp/ohos-sdk -name "native-linux-x64-*.zip" -exec unzip -q {} -d /tmp/ohos-native \;
          CLANG="$(find /tmp/ohos-native -type f -path "*llvm/bin/clang" | head -1)"
          OHOS_NDK="$(dirname "$(dirname "$(dirname "$CLANG")")")"
          {
            echo "CC_aarch64_unknown_linux_ohos=$OHOS_NDK/llvm/bin/clang"
            echo "CXX_aarch64_unknown_linux_ohos=$OHOS_NDK/llvm/bin/clang++"
            echo "AR_aarch64_unknown_linux_ohos=$OHOS_NDK/llvm/bin/llvm-ar"
            echo "CFLAGS_aarch64_unknown_linux_ohos=--target=aarch64-linux-ohos --sysroot=$OHOS_NDK/sysroot"
            echo "CXXFLAGS_aarch64_unknown_linux_ohos=--target=aarch64-linux-ohos --sysroot=$OHOS_NDK/sysroot"
          } >> "$GITHUB_ENV"

      # 排除集与 Android 作业一致：ohos 同样是 native-tls 落 openssl 的目标（传染闭包见
      # issue #235）；render 的字体发现模块只有三桌面实现（见 iOS 作业注释）。
      - name: Check (aarch64-unknown-linux-ohos)
        run: cargo check --workspace --exclude qingjian-macos --exclude qingjian-linux-server --exclude qingjian-windows-server --exclude qingjian-windows-tsf --exclude qingjian-windows-settings --exclude qingjian-platform --exclude qingjian-predict --exclude qingjian-update --exclude qingjian-cli --exclude qingjian-gloss-gen --exclude qingjian-release-sign --exclude qingjian-render --target aarch64-unknown-linux-ohos --locked
